server:
  port: 8080
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 7d
spring:
  servlet:
    multipart:
      max-file-size: 10MB
  config:
    import: optional:file:./.env[.properties],optional:file:./picture-service/.env[.properties]
  application:
    name: picture-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url : jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
    username: ${DB_USER}
    password: ${DB_PASS}
  sql:
    init:
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      mode: never
  data:
    redis:
      host: ${RDS_HOST}
      port: ${RDS_PORT}
      username: ${RDS_USER}
      password: ${RDS_PASS}
      database: 2
      timeout: 5000
  session:
    store-type: redis
    timeout: 7d
    redis:
      namespace: picture-bucket:session
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.ssl.enable]": true
      "[mail.smtp.connectiontimeout]": 30000
      "[mail.smtp.timeout]": 30000
      "[mail.smtp.writetimeout]": 30000
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 逻辑删除字段名
      logic-delete-value: 1        # 逻辑已删除值
      logic-not-delete-value: 0    #逻辑未删除值

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: picture-service
      paths-to-match: /**
      packages-to-scan: com.yosh.server.controller

# 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: ${COS_HOST}
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET}

